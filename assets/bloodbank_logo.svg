<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A54"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <filter id="bloodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="#0B0910"/>
  <rect x="2" y="2" width="96" height="96" rx="24" stroke="url(#bloodGrad)" stroke-width="2.5" fill="none" opacity="0.6"/>
  <!-- Droplet Silhouette -->
  <path d="M50 18 C50 18, 26 48, 26 64 C26 77.25 36.75 88 50 88 C63.25 88 74 77.25 74 64 C74 48, 50 18, 50 18 Z" fill="url(#bloodGrad)" filter="url(#bloodGlow)"/>
  <!-- White Medical Plus Cross -->
  <rect x="46" y="52" width="8" height="24" rx="4" fill="#FFFFFF"/>
  <rect x="38" y="60" width="24" height="8" rx="4" fill="#FFFFFF"/>
</svg>
